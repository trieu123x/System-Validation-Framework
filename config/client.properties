# Cau hinh ung dung chi nhanh
# server=auto -> tu tim server trong LAN bang UDP broadcast (SRS 7.2-A)
# hoac ghi ro: server=192.168.1.10   hoac   server=192.168.1.10:5000
server=auto
server.port=5000
discovery.port=5001

# Giao dien chi nhanh (Next.js da build). Chay nhieu chi nhanh tren 1 may: doi http.port
http.host=127.0.0.1
http.port=8081
ui.dir=ui/out
open.browser=true

# Tu ket noi lai (FR-05), luon cho toi da reconnect.cap.ms giua hai lan thu:
#   jitter  (de xuat) lan dau ngau nhien [0, cap], sau do ngau nhien [cap/2, cap]
#   fixed   (baseline SRS) luon cho dung cap = 5 giay
#   backoff exponential backoff + full jitter
reconnect.strategy=jitter
reconnect.base.ms=500
reconnect.cap.ms=5000

# Bao ve API cuc bo (chi nghe localhost): Origin duoc phep ngoai chinh trang (next dev), so request/giay
security.allowed.origins=http://localhost:3000,http://localhost:3001
security.api.max.per.second=30

# HTTP gateway: protected browser session, cached data reads and SSE handshakes.
# TCP server quota counts actual TCP commands separately (no double count).
scraping.enabled=true
scraping.http.enabled=true
scraping.mode=detect
scraping.http.max.per.window=120
scraping.window.seconds=60
scraping.block.duration.seconds=900

# Public gateways must not allow an unauthenticated browser to redirect the TCP backend.
http.allow.server.override=false

# Optional exact normalized endpoint/command quotas per window (max 16).
# scraping.resource.quotas=HISTORY_GET=10,/api/products=60,/api/state=90
