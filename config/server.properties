# Cau hinh server cong ty
tcp.port=5000
discovery.enabled=true
discovery.port=5001
max.clients=100

# Heartbeat (FR-04): im lang 30s -> PING, khong PONG sau 10s -> dong
heartbeat.idle.seconds=30
heartbeat.pong.timeout.seconds=10

# CSDL PostgreSQL (chi server ket noi)
db.url=jdbc:postgresql://127.0.0.1:5432/phan_phoi_hang
db.user=postgres
# Mat khau dat trong config/server.local.properties (khong dua len git), xem server.local.properties.example
db.password=
db.pool.size=20

# Giao dien admin (Next.js da build) - chi mo tren may server
# Tai khoan dang nhap trang cong ty. admin.password.hash = hex SHA-256(admin.salt + mat khau).
# De trong admin.password.hash = mat khau mac dinh admin123.
admin.user=admin
admin.salt=pp-admin-2026
admin.password.hash=
admin.http.host=127.0.0.1
admin.http.port=8080
ui.dir=ui/out
open.browser=true

# Cai tien va baseline de so sanh (docs/EXPERIMENTS.md). Gia tri mac dinh = giai phap de xuat.
# io.mode: nio | bio
io.mode=nio
nio.workers=16
# accept.strategy: conditional | check_then_act | synchronized
accept.strategy=conditional
# delivery: queue_resync | queue | none
delivery=queue_resync
# write.mode (chi voi io.mode=bio): queued | direct
write.mode=queued
send.queue.limit=2000
experiment.api=true
log.quiet=false

# Giam sat an ninh (thuc nghiem E8). security.mode: off (baseline) | detect (chi ghi su kien) | block (de xuat)
# Nhieu chi nhanh sau mot NAT (Docker Desktop, LAN) chung mot IP: nang security.conn.max.per.ip hoac dung detect
security.mode=block
security.ban.minutes=10
security.login.fail.max=5
security.login.fail.window.seconds=60
security.flood.msgs.per.second=50
security.scrape.max.per.minute=30
security.fuzz.max.per.minute=10
security.idor.max.per.minute=5
security.conn.max.per.ip=20
security.prelogin.timeout.seconds=10
security.allowed.origins=http://localhost:3000,http://localhost:3001
admin.lock.fails=5
admin.lock.minutes=5

# Email bo sung cho NOTICE va canh bao dang nhap; mac dinh tat.
# SMTP secrets dat trong server.local.properties hoac bien moi truong MAIL_* o backend.
mail.enabled=false
mail.smtp.host=
mail.smtp.port=587
# starttls (587), ssl (465), none (chi dung hop thu thu local khong xac thuc)
mail.smtp.security=starttls
mail.smtp.username=
mail.smtp.password=
mail.from=noreply@phanphoi.test
mail.admin.recipients=
# Mot email moi chi nhanh, ngan cach cac chi nhanh bang dau cham phay.
mail.branch.recipients=
mail.timeout.ms=5000
mail.queue.size=200
mail.attempts=3
mail.alert.cooldown.seconds=300

# Anti-scraping V1. Moi rule moi mac dinh detect; TCP legacy van theo security.mode.
scraping.enabled=true
scraping.http.enabled=true
scraping.tcp.enabled=true
scraping.mode=detect
scraping.window.seconds=60
scraping.tcp.max.per.window=60
scraping.http.max.per.window=120
scraping.risk.warning=40
scraping.risk.block=70
scraping.block.duration.seconds=900
scraping.max.subjects=10000
scraping.email.enabled=true
scraping.email.cooldown.seconds=900
scraping.email.max.per.recipient.hour=20

# Optional exact normalized endpoint/command quotas per window (max 16).
# scraping.resource.quotas=HISTORY_GET=10,/api/products=60,/api/state=90
