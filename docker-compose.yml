# Chạy cả hệ thống: scripts\docker-deploy.bat; client chung cho moi chi nhanh
#   trang công ty  http://localhost:8080/admin/   (admin / admin123)
#   chi nhánh      http://localhost:8081/branch/  (CN01 / 123456), http://localhost:8082/branch/ (CN02 / 123456)
# Đổi mật khẩu, cổng... trong file .env (xem .env.example).
name: phanphoi

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: phan_phoi_hang
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-phanphoi}
      SEED_DEMO: ${SEED_DEMO:-1}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/db:ro
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # 5433 để không đụng PostgreSQL cài sẵn trên máy (5432)
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      # qua TCP: trong lúc chạy script khởi tạo, postgres chỉ nghe unix socket nên chưa "healthy"
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d phan_phoi_hang"]
      interval: 3s
      timeout: 3s
      retries: 40

  server:
    build: .
    image: phanphoi:latest
    command: ["server"]
    restart: unless-stopped
    environment:
      SCRAPING_MODE: ${SCRAPING_MODE:-block}
      TZ: Asia/Ho_Chi_Minh
      DB_URL: jdbc:postgresql://db:5432/phan_phoi_hang
      DB_PASSWORD: ${DB_PASSWORD:-phanphoi}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_SECURITY: ${MAIL_SMTP_SECURITY:-starttls}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@phanphoi.test}
      MAIL_ADMIN_RECIPIENTS: ${MAIL_ADMIN_RECIPIENTS:-}
      MAIL_BRANCH_RECIPIENTS: ${MAIL_BRANCH_RECIPIENTS:-}
      ADMIN_ORIGIN: ${TAILSCALE_ADMIN_ORIGIN:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # TCP cho chi nhánh (kể cả client.jar chạy trên máy khác trong LAN, server=<ip máy này>:5000)
      # TCP only inside Compose network; clients access through the shared client gateway.
      # - "${SERVER_TCP_PORT:-5000}:5000"
      # giao diện công ty chỉ mở trên máy này
      - "127.0.0.1:${ADMIN_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 3s
      timeout: 3s
      retries: 40

  client:
    image: phanphoi:latest
    command: ["client", "http.port=8081"]
    restart: unless-stopped
    environment:
      SCRAPING_MODE: ${SCRAPING_MODE:-block}
      TZ: Asia/Ho_Chi_Minh
      SERVER: server:5000
      CLIENT_ORIGIN: ${TAILSCALE_CLIENT_ORIGIN:-}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CLIENT_HTTP_PORT:-8081}:8081"

  # Giả lập tải (TC-11), chỉ chạy khi gọi: docker compose run --rm loadsim clients=100 duration=60
  loadsim:
    image: phanphoi:latest
    command: ["loadsim", "clients=50", "duration=60"]
    profiles: ["tools"]
    environment:
      SCRAPING_MODE: ${SCRAPING_MODE:-block}
      SERVER: server:5000
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
